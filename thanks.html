<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order received — Glendale Band Photos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2332;
      --muted: #4a5568;
      --paper: #f7f4ef;
      --brass: #b08d3e;
      --navy: #1e3a5f;
      --navy-deep: #13263f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 120% 80% at 0% 0%, rgba(30, 58, 95, 0.08), transparent 55%),
        radial-gradient(ellipse 90% 70% at 100% 100%, rgba(176, 141, 62, 0.1), transparent 50%),
        var(--paper);
    }
    .card {
      width: min(32rem, 100%);
      background: #fff;
      border: 1.5px solid var(--navy);
      padding: 2rem 1.75rem;
    }
    .eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brass);
      margin: 0 0 0.5rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: 1.75rem;
      line-height: 1.1;
      color: var(--navy-deep);
      text-transform: uppercase;
    }
    p {
      margin: 0 0 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .summary {
      margin: 1rem 0;
      padding: 0.85rem 0;
      border-top: 1px solid #c5ccd6;
      border-bottom: 1px solid #c5ccd6;
      font-size: 0.92rem;
      color: var(--ink);
    }
    .summary dt {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.55rem;
    }
    .summary dd {
      margin: 0.1rem 0 0;
      word-break: break-word;
    }
    a {
      color: var(--navy);
      font-weight: 700;
    }
    .status-msg {
      font-size: 0.85rem;
      color: var(--navy);
    }
    .status-msg.error { color: #5c1d1d; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Glendale Highschool Marching Band</p>
    <h1 id="title">Order received</h1>
    <p id="lead">Thanks — your photo order was submitted. The photographer will follow up about payment and delivery.</p>
    <dl class="summary" id="summary" hidden></dl>
    <p class="status-msg" id="notify" hidden></p>
    <p id="gallery-link" hidden><a id="gallery-href" href="index.html">Open your photo gallery</a></p>
    <p><a href="order.html">Submit another order</a> · <a href="index.html">Back to gallery</a></p>
  </main>

  <script src="config.js"></script>
  <script>
    const ORDER_STORAGE_KEY = "bandPhotoPendingOrder";
    const params = new URLSearchParams(window.location.search);
    const paid = params.get("paid") === "1";
    const digital = params.get("digital") === "1";
    const sessionId = (params.get("session_id") || "").trim();
    const accessCode = (params.get("code") || "").trim();
    const title = document.getElementById("title");
    const lead = document.getElementById("lead");
    const summary = document.getElementById("summary");
    const notify = document.getElementById("notify");
    const galleryLink = document.getElementById("gallery-link");
    const galleryHref = document.getElementById("gallery-href");

    function renderSummary(order) {
      if (!order) return;
      const rows = [
        ["Student", order.Student],
        ["Access code", order.Access_code],
        ["Grade", order.Grade],
        ["Instrument", order.Instrument],
        ["Package", order.Package],
        ["Package contents", order.Package_contents],
        ["Lab print checklist", order.Lab_print_checklist],
        ["Photos selected for print", order.Selected_photos],
        ["Photo previews", order.Photo_preview_links],
        ["Gallery link", order.Gallery_link],
        ["Delivery", order.Delivery],
        ["Add-ons", order.Add_ons],
        ["Package total", order.Package_total || order.Package_amount_charged],
        ["Add-on total", order.Addon_total],
        ["Total", order.Grand_total],
        ["Parent", order.Parent],
        ["Phone", order.Phone],
        ["Email", order.Email],
        ["Payment", order.Payment],
        ["Date", order.Date],
      ];
      summary.innerHTML = "";
      rows.forEach(([label, value]) => {
        if (!value || value === "—") return;
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.textContent = value;
        summary.appendChild(dt);
        summary.appendChild(dd);
      });
      summary.hidden = false;
    }

    function showGalleryLink(code) {
      if (!code || code === "—") return;
      galleryHref.href = "index.html?code=" + encodeURIComponent(code);
      galleryLink.hidden = false;
    }

    function galleryAbsoluteUrl(code) {
      const c = String(code || "").trim();
      if (!c || c === "—") return "—";
      try {
        return new URL("index.html?code=" + encodeURIComponent(c), window.location.href).href;
      } catch {
        return "index.html?code=" + encodeURIComponent(c);
      }
    }

    function buildPhotoPreviewLinks(order) {
      const apiBase = String(window.BAND_PHOTO_API_BASE || "").replace(/\/$/, "");
      const code = String(order.Access_code || accessCode || "").trim();
      const ids = String(order.Selected_photo_ids || "")
        .split(",")
        .map((id) => id.trim())
        .filter(Boolean);
      if (!apiBase || !code || !ids.length) {
        return order.Photo_preview_links && order.Photo_preview_links !== "—"
          ? order.Photo_preview_links
          : "—";
      }
      const nameById = {};
      String(order.Selected_photos || "").split(/;\s*/).forEach((part) => {
        const m = String(part).trim().match(/^\d+\.\s*(.+?)(?:\s*\[([^\]]+)\])?\s*$/);
        if (!m) return;
        const filename = m[1].trim();
        const id = (m[2] || filename).trim();
        if (id) nameById[id] = filename;
      });
      return ids
        .map((id, i) => {
          const label = nameById[id] || id;
          const url = apiBase + "/api/photo?code=" + encodeURIComponent(code) + "&id=" + encodeURIComponent(id);
          return (i + 1) + ". " + label + " — " + url;
        })
        .join(" | ");
    }

    function deliveryForOrder(order) {
      if (order.Delivery && order.Delivery !== "—") return order.Delivery;
      const pkg = String(order.Package || "").toLowerCase();
      const lab = String(order.Lab_print_checklist || "").toLowerCase();
      const digitalUnlock = String(order.Digital_unlock || "").toLowerCase();
      const isDigitalOnly = digital || /^digital rights/.test(pkg) || lab.includes("digital only");
      const hasPrints = !isDigitalOnly && (lab.includes("print") || /\d/.test(lab) || /keepsake|showcase|all-star|allstar/.test(pkg));
      const includesDigital =
        digitalUnlock.includes("all gallery") ||
        /showcase|all-star|allstar|digital/.test(pkg);

      if (isDigitalOnly) {
        return "Digital Rights: ALL gallery photos are unlocked for download online. This digital-only order does not include lab prints for school delivery.";
      }
      if (hasPrints && includesDigital) {
        return "Your selected photos will be printed and then brought to the school for delivery. Digital downloads unlock ALL gallery photos online (not only the print-selected ones).";
      }
      if (hasPrints) {
        return "Your selected photos will be printed and then brought to the school for delivery.";
      }
      return "If your package includes prints, they will be printed and then brought to the school for delivery.";
    }

    function enrichOrderForEmail(order) {
      const code = String(order.Access_code || accessCode || "").trim() || "—";
      const student = order.Student || "Student";
      const enriched = Object.assign({}, order, {
        Access_code: code,
        Gallery_link: order.Gallery_link && order.Gallery_link !== "—"
          ? order.Gallery_link
          : galleryAbsoluteUrl(code),
        Photo_preview_links: buildPhotoPreviewLinks(order),
        Delivery: deliveryForOrder(order),
        _template: "table",
        _captcha: "false",
      });
      if (!enriched._subject || /pending/i.test(String(enriched.Payment || ""))) {
        enriched._subject = code !== "—"
          ? "Order confirmation — Glendale band photos — " + student + " — " + code
          : "Order confirmation — Glendale band photos — " + student;
      }
      return enriched;
    }

    async function formSubmitTo(toEmail, payload) {
      const response = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(toEmail), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json",
        },
        body: JSON.stringify(payload),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(result.message || "Could not send order email.");
      }
      return result;
    }

    /**
     * Dual confirmation via one FormSubmit post to the photographer:
     * - Full order table (photos, package, delivery, totals)
     * - _cc parent email (reliable; parent does not need FormSubmit activation)
     * - _replyto parent so Allyson can reply easily
     */
    async function emailOrderConfirmations(order) {
      const photographerEmail = (window.BAND_PHOTO_ORDER_EMAIL || "").trim();
      if (!photographerEmail || photographerEmail.includes("REPLACE")) {
        throw new Error("Order email isn’t connected yet.");
      }

      const enriched = enrichOrderForEmail(order);
      const parentEmail = String(enriched.Email || "").trim();
      const parentOk =
        parentEmail &&
        parentEmail.includes("@") &&
        parentEmail.toLowerCase() !== photographerEmail.toLowerCase();

      const photographerPayload = Object.assign({}, enriched, {
        _subject: enriched._subject || "Order confirmation — Glendale band photos",
      });
      if (parentOk) {
        photographerPayload._replyto = parentEmail;
        photographerPayload._cc = parentEmail;
      }

      await formSubmitTo(photographerEmail, photographerPayload);
      return { parentCc: parentOk };
    }

    async function verifyPayment(sessionId) {
      const base = String(window.BAND_PHOTO_API_BASE || "").replace(/\/$/, "");
      if (!base || !sessionId) return null;
      const response = await fetch(base + "/api/verify-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ sessionId }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "Could not unlock gallery.");
      return result;
    }

    function mergeOrder(localOrder, serverOrder) {
      if (!serverOrder && !localOrder) return null;
      return Object.assign({}, localOrder || {}, serverOrder || {});
    }

    (async function init() {
      let order = null;
      try {
        order = JSON.parse(sessionStorage.getItem(ORDER_STORAGE_KEY) || "null");
      } catch {
        order = null;
      }

      if (accessCode) showGalleryLink(accessCode);
      else if (order && order.Access_code && order.Access_code !== "—") showGalleryLink(order.Access_code);

      if (paid) {
        title.textContent = digital ? "Digital rights unlocked" : "Payment received";
        lead.textContent = digital
          ? "Thanks — digital rights are paid. Open the gallery with your access code to download ALL photos (checkboxes only affect prints). A confirmation was emailed to you and the photographer."
          : "Thanks — your card payment went through. Print packages: selected photos will be printed and brought to the school for delivery. If digital is included, open the gallery to download every photo.";

        let verified = null;
        if (sessionId) {
          notify.hidden = false;
          notify.textContent = "Confirming payment and gallery access…";
          try {
            verified = await verifyPayment(sessionId);
            if (verified && verified.unlocked) {
              notify.textContent = "Digital access is on for code " + (verified.accessCode || "") + " — all gallery photos can be downloaded.";
              if (verified.accessCode) showGalleryLink(verified.accessCode);
            } else if (verified && verified.includesDigital) {
              notify.textContent = verified.reminder || "Payment recorded. If you have a gallery code, ask the photographer to link digital access.";
            } else {
              notify.textContent = "Payment recorded.";
            }
          } catch (err) {
            notify.classList.add("error");
            notify.textContent = "Payment succeeded, but gallery unlock didn’t confirm automatically. (" + err.message + ")";
          }
        }

        order = mergeOrder(order, verified && verified.orderForEmail);
        if (order) {
          if (!order.Payment || /pending/i.test(order.Payment)) {
            order.Payment = "Paid online via Stripe" + (sessionId ? " · session " + sessionId : "");
          }
          order = enrichOrderForEmail(order);
          renderSummary(order);
          if (!notify.textContent) {
            notify.hidden = false;
            notify.textContent = "Sending order confirmations…";
          }
          try {
            const sentKey = "bandPhotoOrderSent:" + (sessionId || order.Student + order.Grand_total);
            if (!sessionStorage.getItem(sentKey)) {
              const result = await emailOrderConfirmations(order);
              sessionStorage.setItem(sentKey, "1");
              const who = result.parentCc
                ? "you and the photographer"
                : "the photographer";
              notify.textContent = (notify.textContent ? notify.textContent + " " : "") +
                "Order confirmation emailed to " + who + ".";
            }
            sessionStorage.removeItem(ORDER_STORAGE_KEY);
          } catch (err) {
            notify.classList.add("error");
            notify.textContent = "Payment succeeded, but the order email didn’t send automatically. Please screenshot this page or email the photographer. (" + err.message + ")";
          }
        } else if (!sessionId) {
          lead.textContent = "Thanks — your card payment went through. If you don’t hear back, contact the photographer and mention your Stripe payment.";
        }
      } else {
        if (order) {
          order = enrichOrderForEmail(order);
          renderSummary(order);
        }
        sessionStorage.removeItem(ORDER_STORAGE_KEY);
      }
    })();
  </script>
</body>
</html>
