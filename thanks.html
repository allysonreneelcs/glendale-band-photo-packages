<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order received — Glendale Band Photos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2332;
      --muted: #4a5568;
      --paper: #f7f4ef;
      --brass: #b08d3e;
      --navy: #1e3a5f;
      --navy-deep: #13263f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 120% 80% at 0% 0%, rgba(30, 58, 95, 0.08), transparent 55%),
        radial-gradient(ellipse 90% 70% at 100% 100%, rgba(176, 141, 62, 0.1), transparent 50%),
        var(--paper);
    }
    .card {
      width: min(32rem, 100%);
      background: #fff;
      border: 1.5px solid var(--navy);
      padding: 2rem 1.75rem;
    }
    .eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brass);
      margin: 0 0 0.5rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: 1.75rem;
      line-height: 1.1;
      color: var(--navy-deep);
      text-transform: uppercase;
    }
    p {
      margin: 0 0 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .summary {
      margin: 1rem 0;
      padding: 0.85rem 0;
      border-top: 1px solid #c5ccd6;
      border-bottom: 1px solid #c5ccd6;
      font-size: 0.92rem;
      color: var(--ink);
    }
    .summary dt {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.55rem;
    }
    .summary dd {
      margin: 0.1rem 0 0;
    }
    a {
      color: var(--navy);
      font-weight: 700;
    }
    .status-msg {
      font-size: 0.85rem;
      color: var(--navy);
    }
    .status-msg.error { color: #5c1d1d; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Glendale Highschool Marching Band</p>
    <h1 id="title">Order received</h1>
    <p id="lead">Thanks — your photo order was submitted. The photographer will follow up about payment and delivery.</p>
    <dl class="summary" id="summary" hidden></dl>
    <p class="status-msg" id="notify" hidden></p>
    <p id="gallery-link" hidden><a id="gallery-href" href="gallery.html">Open your photo gallery</a></p>
    <p><a href="index.html">Submit another order</a></p>
  </main>

  <script src="config.js"></script>
  <script>
    const ORDER_STORAGE_KEY = "bandPhotoPendingOrder";
    const params = new URLSearchParams(window.location.search);
    const paid = params.get("paid") === "1";
    const digital = params.get("digital") === "1";
    const sessionId = (params.get("session_id") || "").trim();
    const accessCode = (params.get("code") || "").trim();
    const title = document.getElementById("title");
    const lead = document.getElementById("lead");
    const summary = document.getElementById("summary");
    const notify = document.getElementById("notify");
    const galleryLink = document.getElementById("gallery-link");
    const galleryHref = document.getElementById("gallery-href");

    function renderSummary(order) {
      if (!order) return;
      const rows = [
        ["Student", order.Student],
        ["Access code", order.Access_code],
        ["Package", order.Package],
        ["Add-ons", order.Add_ons],
        ["Total", order.Grand_total],
        ["Parent", order.Parent],
        ["Email", order.Email],
        ["Payment", order.Payment],
      ];
      summary.innerHTML = "";
      rows.forEach(([label, value]) => {
        if (!value || value === "—") return;
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.textContent = value;
        summary.appendChild(dt);
        summary.appendChild(dd);
      });
      summary.hidden = false;
    }

    function showGalleryLink(code) {
      if (!code) return;
      galleryHref.href = "gallery.html?code=" + encodeURIComponent(code);
      galleryLink.hidden = false;
    }

    async function emailOrder(payload) {
      const orderEmail = (window.BAND_PHOTO_ORDER_EMAIL || "").trim();
      if (!orderEmail || orderEmail.includes("REPLACE")) {
        throw new Error("Order email isn’t connected yet.");
      }
      const response = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(orderEmail), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Accept: "application/json",
        },
        body: JSON.stringify(payload),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(result.message || "Could not send order email.");
      }
    }

    async function verifyPayment(sessionId) {
      const base = String(window.BAND_PHOTO_API_BASE || "").replace(/\/$/, "");
      if (!base || !sessionId) return null;
      const response = await fetch(base + "/api/verify-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ sessionId }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "Could not unlock gallery.");
      return result;
    }

    (async function init() {
      let order = null;
      try {
        order = JSON.parse(sessionStorage.getItem(ORDER_STORAGE_KEY) || "null");
      } catch {
        order = null;
      }

      if (accessCode) showGalleryLink(accessCode);
      else if (order && order.Access_code && order.Access_code !== "—") showGalleryLink(order.Access_code);

      if (paid) {
        title.textContent = digital ? "Digital rights unlocked" : "Payment received";
        lead.textContent = digital
          ? "Thanks — digital rights are paid. Open your gallery, and the photographer will enable Lightroom downloads for your album."
          : "Thanks — your card payment went through and your photo order is on its way to the photographer.";

        if (sessionId) {
          notify.hidden = false;
          notify.textContent = "Confirming payment and gallery access…";
          try {
            const verified = await verifyPayment(sessionId);
            if (verified && verified.unlocked) {
              notify.textContent = "Gallery digital access is marked paid for code " + (verified.accessCode || "") + ".";
              if (verified.accessCode) showGalleryLink(verified.accessCode);
            } else if (verified && verified.includesDigital) {
              notify.textContent = verified.reminder || "Payment recorded. If you have a gallery code, ask the photographer to link digital access.";
            } else {
              notify.textContent = "Payment recorded.";
            }
          } catch (err) {
            notify.classList.add("error");
            notify.textContent = "Payment succeeded, but gallery unlock didn’t confirm automatically. (" + err.message + ")";
          }
        }

        if (order) {
          order.Payment = "Paid online via Stripe" + (sessionId ? " · session " + sessionId : "");
          renderSummary(order);
          if (!notify.textContent) {
            notify.hidden = false;
            notify.textContent = "Sending order details to the photographer…";
          }
          try {
            const sentKey = "bandPhotoOrderSent:" + (sessionId || order.Student + order.Grand_total);
            if (!sessionStorage.getItem(sentKey) && !digital) {
              await emailOrder(order);
              sessionStorage.setItem(sentKey, "1");
              notify.textContent = (notify.textContent ? notify.textContent + " " : "") + "Order details were emailed to the photographer.";
            }
            sessionStorage.removeItem(ORDER_STORAGE_KEY);
          } catch (err) {
            notify.classList.add("error");
            notify.textContent = "Payment succeeded, but the order email didn’t send automatically. Please screenshot this page or email the photographer. (" + err.message + ")";
          }
        } else if (!sessionId) {
          lead.textContent = "Thanks — your card payment went through. If you don’t hear back, contact the photographer and mention your Stripe payment.";
        }
      } else {
        if (order) renderSummary(order);
        sessionStorage.removeItem(ORDER_STORAGE_KEY);
      }
    })();
  </script>
</body>
</html>
