<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting to gallery…</title>
  <script>
    (function () {
      var q = window.location.search || "";
      window.location.replace("index.html" + q);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=index.html" />
  <link rel="canonical" href="index.html" />
</head>
<body>
  <p>The gallery is now the main page. <a id="go" href="index.html">Continue</a>.</p>
  <script>
    document.getElementById("go").href = "index.html" + (window.location.search || "");
  </script>
</body>
</html>
